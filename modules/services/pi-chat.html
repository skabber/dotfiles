<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pi chat</title>
<style>
  :root {
    --bg: #16161e; --panel: #1e1e2a; --card: #22222f; --line: #31314580;
    --fg: #e6e6f0; --dim: #9a9ab0; --accent: #89b4fa;
    --green: #a6e3a1; --red: #f38ba8; --yellow: #f9e2af; --gray: #6c7086;
    --lav: #cba6f7; --teal: #94e2d5; --peach: #fab387;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.45 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--line);
    flex: none; z-index: 5;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header h1 .at { color: var(--dim); font-weight: 400; }
  #stat { color: var(--dim); font-size: 12px; display: flex; gap: 10px; align-items: center; }
  #stat .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gray); }
  #stat.run .dot { background: var(--yellow); animation: pulse 1.1s infinite; }
  #stat.err .dot { background: var(--red); }
  #stat.ok .dot { background: var(--green); }
  @keyframes pulse { 50% { opacity: .35; } }
  #model {
    font: 12px ui-monospace, monospace; color: var(--fg); min-width: 200px;
    background: #00000050; border: 1px solid var(--line); border-radius: 7px;
    padding: 5px 9px; outline: none;
  }
  #model:focus { border-color: #89b4fa80; }
  .spacer { flex: 1; }
  button {
    font: inherit; color: var(--fg); background: #00000050;
    border: 1px solid var(--line); border-radius: 7px; padding: 5px 14px;
    cursor: pointer; transition: background .15s, border-color .15s;
  }
  button:hover:not(:disabled) { background: #89b4fa26; border-color: #89b4fa80; }
  button:disabled { opacity: .35; cursor: default; }
  #layout {
    flex: 1; display: grid; min-height: 0;
    grid-template-columns: 250px minmax(360px, 1fr) minmax(400px, 46%);
  }
  @media (max-width: 1100px) {
    #layout { grid-template-columns: 210px 1fr; }
    #viewer { display: none; }
    #viewer.force { display: flex; position: fixed; inset: 52px 0 0 210px; z-index: 4; }
  }
  /* ---------- file tree ---------- */
  #files {
    border-right: 1px solid var(--line); background: var(--panel);
    display: flex; flex-direction: column; min-height: 0;
  }
  #files .bar { padding: 8px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; }
  #ftree-filter {
    flex: 1; font: 12px ui-monospace, monospace; color: var(--fg);
    background: #00000050; border: 1px solid var(--line); border-radius: 6px;
    padding: 4px 8px; outline: none; min-width: 0;
  }
  #ftree-filter:focus { border-color: #89b4fa80; }
  #tree { flex: 1; overflow: auto; padding: 6px 4px; font: 12.5px/1.6 ui-monospace, monospace; }
  .dir { user-select: none; cursor: pointer; white-space: nowrap; }
  .dir .tw { color: var(--dim); display: inline-block; width: 12px; font-size: 9px;
             transition: transform .12s; }
  .dir.open > .row .tw { transform: rotate(90deg); }
  .dir .row:hover { color: var(--accent); }
  .dir .kids { display: none; }
  .dir.open > .kids { display: block; }
  .file { cursor: pointer; white-space: nowrap; }
  .file:hover { color: var(--accent); }
  .file.sel { color: var(--accent); background: #89b4fa14; border-radius: 4px; }
  .sdot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-left: 6px; }
  .sdot.M { background: var(--yellow); } .sdot.A, .sdot.Q { background: var(--green); }
  .sdot.D { background: var(--red); } .sdot.R { background: var(--lav); }
  /* ---------- chat ---------- */
  #chat { display: flex; flex-direction: column; min-height: 0; }
  #msgs { flex: 1; overflow-y: auto; padding: 16px 18px; scroll-behavior: smooth; }
  .turn { margin-bottom: 18px; }
  .msg-user {
    margin: 14px 0 10px auto; max-width: 85%; width: fit-content;
    background: #89b4fa1c; border: 1px solid #89b4fa36; color: var(--fg);
    padding: 8px 13px; border-radius: 12px 12px 3px 12px; white-space: pre-wrap;
    word-break: break-word;
  }
  .msg-a { max-width: 100%; word-break: break-word; }
  .msg-a .who { color: var(--accent); font-weight: 700; font-size: 12px; margin-bottom: 3px; }
  .msg-a .body { color: var(--fg); }
  .msg-a .body h3 { margin: 10px 0 4px; font-size: 14px; color: var(--peach); }
  .msg-a .body h4 { margin: 8px 0 3px; font-size: 13px; color: var(--dim); }
  .msg-a .body a { color: var(--accent); }
  .msg-a .body ul { margin: 4px 0; padding-left: 22px; }
  .msg-a .body code {
    font: 12px ui-monospace, monospace; background: #00000050;
    padding: 1px 5px; border-radius: 4px; color: var(--teal);
  }
  pre.code {
    background: #00000059; border: 1px solid #31314540; border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; margin: 8px 0;
    font: 12px/1.55 ui-monospace, "JetBrains Mono", monospace; color: #cdd6f4;
  }
  details.think { margin: 6px 0; }
  details.think summary {
    cursor: pointer; color: var(--dim); font-size: 11.5px; user-select: none;
    list-style: none; display: inline-flex; gap: 4px; align-items: center;
  }
  details.think summary::before { content: "▸"; font-size: 9px; transition: transform .12s; }
  details.think[open] summary::before { transform: rotate(90deg); }
  details.think .t {
    color: var(--dim); font-size: 12px; white-space: pre-wrap; border-left: 2px solid var(--line);
    padding-left: 10px; margin-top: 5px; max-height: 220px; overflow: auto;
  }
  .tool {
    border: 1px solid var(--line); border-radius: 8px; margin: 8px 0;
    background: #00000035; overflow: hidden;
  }
  .tool .head {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px;
    cursor: pointer; user-select: none; font: 12px ui-monospace, monospace;
  }
  .tool .head:hover { background: #89b4fa0d; }
  .tool .ic { flex: none; }
  .tool .nm { color: var(--lav); flex: none; }
  .tool .arg { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool .state { margin-left: auto; flex: none; color: var(--dim); font-size: 10.5px; }
  .tool.running .state { color: var(--yellow); animation: pulse 1.1s infinite; }
  .tool.error .state { color: var(--red); }
  .tool pre {
    display: none; margin: 0; padding: 8px 11px; border-top: 1px solid var(--line);
    font: 11.5px/1.5 ui-monospace, monospace; color: #cdd6f4; white-space: pre-wrap;
    word-break: break-word; max-height: 300px; overflow: auto;
  }
  .tool.open pre { display: block; }
  .sysline { color: var(--dim); font-size: 12px; margin: 4px 0; }
  .sysline.err { color: var(--red); white-space: pre-wrap; }
  .cursor { display: inline-block; width: 8px; height: 14px; background: var(--accent);
            vertical-align: text-bottom; animation: pulse .8s infinite; }
  #composer {
    flex: none; border-top: 1px solid var(--line); background: var(--panel);
    padding: 10px 12px; display: flex; gap: 8px; align-items: flex-end;
  }
  #prompt {
    flex: 1; resize: none; font: inherit; color: var(--fg); background: #00000050;
    border: 1px solid var(--line); border-radius: 9px; padding: 9px 12px;
    outline: none; max-height: 180px; min-height: 40px;
  }
  #prompt:focus { border-color: #89b4fa80; }
  #send { background: var(--accent); color: #16161e; font-weight: 700; border: none;
          border-radius: 9px; padding: 9px 18px; }
  #send:disabled { opacity: .35; }
  #stopbtn { display: none; border-color: #f38ba860; color: var(--red); }
  #stopbtn.show { display: block; }
  #hint { flex: none; padding: 4px 16px; color: var(--dim); font-size: 11px;
          background: var(--panel); border-top: 1px solid var(--line); }
  /* ---------- viewer ---------- */
  #viewer { display: flex; flex-direction: column; min-height: 0;
            border-left: 1px solid var(--line); background: var(--bg); }
  #vtabs { display: flex; gap: 4px; padding: 8px 10px 0; border-bottom: 1px solid var(--line);
           background: var(--panel); align-items: center; }
  .vtab {
    font: 12px ui-monospace, monospace; color: var(--dim); cursor: pointer;
    padding: 6px 13px; border-radius: 8px 8px 0 0; border: 1px solid transparent;
    border-bottom: none; user-select: none; position: relative; top: 1px;
  }
  .vtab:hover:not(.on):not([disabled]) { color: var(--fg); }
  .vtab.on { color: var(--accent); background: var(--bg); border-color: var(--line); }
  .vtab[disabled] { opacity: .3; cursor: default; }
  .vtab .n { color: var(--yellow); }
  #vref { margin-left: auto; color: var(--dim); font: 11px ui-monospace, monospace;
          padding-right: 6px; max-width: 45%; overflow: hidden; text-overflow: ellipsis;
          white-space: nowrap; }
  #vbody { flex: 1; overflow: auto; min-height: 0; }
  .codeview { font: 12px/1.6 ui-monospace, "JetBrains Mono", monospace; color: #cdd6f4; }
  .codeview table { border-collapse: collapse; width: 100%; }
  .codeview td { padding: 0 10px 0 0; vertical-align: top; white-space: pre; }
  .codeview td.ln { text-align: right; color: #585b70; user-select: none;
                    border-right: 1px solid var(--line); padding-right: 8px; min-width: 40px; }
  .diff { font: 12px/1.55 ui-monospace, "JetBrains Mono", monospace; }
  .diff .fh { color: var(--peach); background: #1e1e2a; padding: 6px 12px;
              position: sticky; top: 0; border-bottom: 1px solid var(--line); font-weight: 600; }
  .diff .hunk { color: var(--accent); background: #89b4fa0f; padding: 1px 12px;
                user-select: none; }
  .diff .dl { padding: 0 12px; white-space: pre-wrap; word-break: break-all; }
  .diff .dl.add { background: #a6e3a114; color: #b5e6b1; }
  .diff .dl.del { background: #f38ba814; color: #f0a9bb; }
  .diff .dl.ctx { color: #a9adc2; }
  .diff .dl .m { color: #585b70; user-select: none; margin-right: 8px; }
  .empty { color: var(--dim); text-align: center; padding: 60px 20px; }
  .chlist { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px;
            border-bottom: 1px solid var(--line); background: var(--panel); }
  .chfile { font: 11.5px ui-monospace, monospace; color: var(--fg); cursor: pointer;
            background: #00000040; border: 1px solid var(--line); border-radius: 6px;
            padding: 3px 9px; }
  .chfile:hover { border-color: #89b4fa80; color: var(--accent); }
  .cmt { display: flex; gap: 10px; padding: 3px 12px; font: 11.5px ui-monospace, monospace; }
  .cmt .h { color: var(--peach); } .cmt .d { color: var(--dim); }
  .cmts { border-bottom: 1px solid var(--line); padding: 6px 0; background: #00000020; }
  .cmts summary { cursor: pointer; color: var(--dim); font-size: 11.5px; padding: 0 12px; }
  /* syntax */
  .k { color: #cba6f7; } .s { color: #a6e3a1; } .c { color: #6c7086; font-style: italic; }
  .n { color: #fab387; } .b { color: #89dceb; }
  /* lock + toast */
  #toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid #89b4fa60; color: var(--fg);
    padding: 8px 18px; border-radius: 8px; opacity: 0; pointer-events: none;
    transition: opacity .3s; z-index: 30; max-width: 80vw;
  }
  #toast.show { opacity: 1; }
  #lock {
    position: fixed; inset: 0; z-index: 40; background: #000000cc;
    display: flex; align-items: center; justify-content: center;
  }
  #lock[hidden] { display: none; }
  #lock form {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 24px; display: flex; flex-direction: column; gap: 10px; width: 320px;
  }
  #lock input {
    font: inherit; background: #00000050; color: var(--fg);
    border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px;
  }
</style>
</head>
<body>
<header>
  <h1>π chat <span class="at" id="hstat"></span></h1>
  <div id="stat"><span class="dot"></span><span id="stattxt">connecting…</span></div>
  <input id="model" list="model-list" placeholder="model (default)" spellcheck="false">
  <datalist id="model-list"></datalist>
  <div class="spacer"></div>
  <button id="newchat">new chat</button>
</header>
<div id="layout">
  <aside id="files">
    <div class="bar">
      <input id="ftree-filter" placeholder="filter…" spellcheck="false">
    </div>
    <div id="tree"></div>
  </aside>
  <section id="chat">
    <div id="msgs"></div>
    <div id="composer">
      <textarea id="prompt" rows="1" placeholder="ask pi to change the dotfiles…"></textarea>
      <button id="stopbtn" title="stop the running agent">stop</button>
      <button id="send">send</button>
    </div>
    <div id="hint">enter to send · shift+enter for newline · the agent edits /home/jay/dotfiles directly</div>
  </section>
  <section id="viewer">
    <div id="vtabs">
      <span class="vtab on" data-v="changes">changes <span class="n" id="nchanges"></span></span>
      <span class="vtab" data-v="file" id="tab-file" disabled>file</span>
      <span class="vtab" data-v="diff" id="tab-diff" disabled>diff</span>
      <span id="vref"></span>
    </div>
    <div id="vbody"><div class="empty">no working-tree changes</div></div>
  </section>
</div>
<div id="toast"></div>
<div id="lock" hidden>
  <form onsubmit="return saveToken(event)">
    <b>pi-chat</b>
    <span style="color:var(--dim)">A bearer token is required.</span>
    <input id="token-input" type="password" placeholder="token" autofocus>
    <button type="submit">unlock</button>
  </form>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const TOKEN_KEY = "pi_chat_token", SESS_KEY = "pi_chat_session", MODEL_KEY = "pi_chat_model";

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3500);
}

/* ---------------- api ---------------- */
async function api(path, opts) {
  const headers = Object.assign({}, opts && opts.headers);
  const tok = localStorage.getItem(TOKEN_KEY);
  if (tok) headers["Authorization"] = "Bearer " + tok;
  const r = await fetch(path, Object.assign({}, opts, { headers }));
  if (r.status === 401) { $("#lock").hidden = false; throw new Error("unauthorized"); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || ("http " + r.status));
  return r.json();
}
function saveToken(ev) {
  ev.preventDefault();
  localStorage.setItem(TOKEN_KEY, $("#token-input").value);
  $("#lock").hidden = true;
  boot();
  return false;
}

/* ---------------- session ---------------- */
function newSessionId() {
  return crypto.randomUUID().replace(/-/g, "").slice(0, 24);
}
let session = localStorage.getItem(SESS_KEY);
if (!session || !/^[A-Za-z0-9][A-Za-z0-9_-]{5,63}$/.test(session)) {
  session = newSessionId();
  localStorage.setItem(SESS_KEY, session);
}

/* ---------------- syntax highlighting (small, safe) ---------------- */
const LANGS = {
  nix: { c: "#", kw: "let|in|if|then|else|assert|with|rec|inherit|import|or|true|false|null" },
  py: { c: "#", kw: "def|class|return|if|elif|else|for|while|import|from|as|with|try|except|finally|raise|lambda|yield|pass|break|continue|global|nonlocal|assert|del|and|or|not|is|in|None|True|False|async|await|match|case" },
  sh: { c: "#", kw: "if|then|else|elif|fi|for|in|do|done|while|case|esac|function|return|local|export|source|set|echo|exit" },
  js: { c: "//", kw: "function|const|let|var|return|if|else|for|while|class|extends|new|import|from|export|default|async|await|try|catch|finally|throw|typeof|instanceof|of|in|null|undefined|true|false|this|switch|case|break|continue" },
  json: { c: null, kw: "true|false|null" },
  css: { c: "//", kw: null },
  html: { c: "!--", kw: null },
  md: { c: null, kw: null },
};
function langOf(name) {
  const e = (name.split(".").pop() || "").toLowerCase();
  return { nix: "nix", py: "py", sh: "bash", bash: "sh", zsh: "sh", js: "js", mjs: "js",
           ts: "js", json: "json", css: "css", html: "html", htm: "html", xml: "html",
           md: "md", markdown: "md" }[e] || null;
}
function hl(code, lang) {
  const L = LANGS[lang];
  let s = esc(code);
  if (!L) return s;
  const alts = [];
  if (L.c === "!--") alts.push("<!--[\\s\\S]*?-->");
  else if (L.c) alts.push(L.c + "[^\\n]*");
  alts.push("\"[^\"\\n]*\"|'[^'\\n]*'");
  if (L.kw) alts.push("\\b(?:" + L.kw + ")\\b");
  alts.push("\\b\\d+(?:\\.\\d+)?\\b");
  return s.replace(new RegExp(alts.join("|"), "g"), m => {
    if (m.startsWith(L.c)) return `<span class="c">${m}</span>`;
    if (/^["']/.test(m)) return `<span class="s">${m}</span>`;
    if (/^\d/.test(m)) return `<span class="n">${m}</span>`;
    return `<span class="k">${m}</span>`;
  });
}

/* ---------------- markdown-lite ---------------- */
function md(src) {
  const blocks = [];
  src = String(src).replace(/```([\w-]*)\n?([\s\S]*?)```/g, (m, lang, code) => {
    blocks.push(`<pre class="code">${hl(code.replace(/\n$/, ""), lang || null)}</pre>`);
    return "\u0000" + (blocks.length - 1) + "\u0000";
  });
  let h = esc(src);
  h = h.replace(/^###?#? (.*$)/gm, m => m.startsWith("####") ? `<h4>${m.slice(5)}</h4>` : (m.startsWith("###") ? `<h4>${m.slice(4)}</h4>` : `<h3>${m.slice(m.indexOf(" ") + 1)}</h3>`));
  h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  h = h.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  h = h.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener">$1</a>');
  h = h.replace(/^(\s*)[-*] (.+)$/gm, "$1<li>$2</li>");
  h = h.replace(/((?:^<li>.*<\/li>\n?)+)/gm, "<ul>$1</ul>");
  h = h.replace(/\n{2,}/g, "\n\n\u200b\n\n");
  h = h.replace(/\n/g, "<br>");
  h = h.replace(/\u200b<br>/g, "");
  h = h.replace(/\u0000(\d+)\u0000/g, (m, i) => blocks[i]);
  return h;
}

/* ---------------- chat ---------------- */
const msgs = $("#msgs");
let running = false;
let curTurn = null, curA = null;
let thinkBuf = null, textBuf = null, liveCursor = null;

function newTurn() {
  const t = document.createElement("div");
  t.className = "turn";
  msgs.appendChild(t);
  curTurn = t;
  return t;
}
function addUser(text) {
  const d = document.createElement("div");
  d.className = "msg-user";
  d.textContent = text;
  (curTurn || newTurn()).appendChild(d);
}
function startAssistant() {
  const wrap = document.createElement("div");
  wrap.className = "msg-a";
  wrap.innerHTML = '<div class="who">pi</div><div class="body"></div>';
  (curTurn || newTurn()).appendChild(wrap);
  curA = wrap.querySelector(".body");
  return curA;
}
function ensureAssistant() { return curA || startAssistant(); }
function clearLive() {
  if (liveCursor) liveCursor.remove();
  liveCursor = null; thinkBuf = null; textBuf = null;
}
function scrollChat() { msgs.scrollTop = msgs.scrollHeight; }
function sysLine(text, err) {
  const d = document.createElement("div");
  d.className = "sysline" + (err ? " err" : "");
  d.textContent = text;
  (curTurn || msgs).appendChild(d);
  scrollChat();
}

const TOOL_ICONS = { bash: "▸", read: "👁", edit: "✎", write: "✚", glob: "⌕", grep: "⌕" };
function toolArgSummary(name, args) {
  const a = args || {};
  const v = a.command || a.path || a.pattern || a.file_path || a.filePath ||
            a.note || (name === "bash" ? "" : "");
  return v ? String(v).slice(0, 120) : "";
}
function makeToolCard(id, name, args) {
  const d = document.createElement("div");
  d.className = "tool running";
  d.dataset.tid = id || "";
  d.innerHTML = `<div class="head"><span class="ic">${TOOL_ICONS[name] || "·"}</span>` +
    `<span class="nm">${esc(name || "tool")}</span>` +
    `<span class="arg">${esc(toolArgSummary(name, args))}</span>` +
    `<span class="state">running</span></div><pre></pre>`;
  d.querySelector(".head").onclick = () => d.classList.toggle("open");
  ensureAssistant().appendChild(d);
  scrollChat();
  return d;
}
function findToolCard(id) {
  return id ? curA.querySelector(`.tool[data-tid="${CSS.escape(id)}"]`) : null;
}
function finishToolCard(card, output, isError) {
  card.classList.remove("running");
  card.classList.toggle("error", !!isError);
  card.querySelector(".state").textContent = isError ? "error" : "done";
  card.querySelector("pre").textContent = output || "(no output)";
}

/* live streaming events */
function onPiEvent(d) {
  switch (d.type) {
    case "message_update": {
      const e = d.assistantMessageEvent;
      if (!e) break;
      if (e.type === "thinking_start" && !thinkBuf) {
        const det = document.createElement("details");
        det.className = "think";
        det.innerHTML = '<summary>thinking…</summary><div class="t"></div>';
        ensureAssistant().appendChild(det);
        thinkBuf = det.querySelector(".t");
      } else if (e.type === "thinking_delta" && thinkBuf) {
        thinkBuf.textContent += e.delta;
      } else if (e.type === "text_start" && !textBuf) {
        clearLive();
        const p = document.createElement("div");
        ensureAssistant().appendChild(p);
        textBuf = p;
        liveCursor = document.createElement("span");
        liveCursor.className = "cursor";
        p.appendChild(liveCursor);
      } else if (e.type === "text_delta" && textBuf) {
        textBuf.insertBefore(document.createTextNode(e.delta), liveCursor);
      }
      scrollChat();
      break;
    }
    case "message_end": {
      const m = d.message || {};
      if (m.role === "user") break;
      if (m.role === "assistant") {
        clearLive();
        const body = ensureAssistant();
        const old = body.parentNode;
        const fresh = startAssistant();
        old.remove();
        for (const c of m.content || []) {
          if (c.type === "text" && c.text && c.text.trim())
            fresh.insertAdjacentHTML("beforeend",
              `<div>${md(c.text)}</div>`);
          else if (c.type === "toolCall")
            makeToolCard(c.id, c.name, c.arguments);
        }
        curA = fresh;
      } else if (m.role === "toolResult") {
        const card = findToolCard(m.toolCallId);
        const text = (m.content || []).map(c => c.text || "").join("");
        if (card) finishToolCard(card, text, m.isError);
        else { const c2 = makeToolCard(m.toolCallId, m.toolName, {});
               finishToolCard(c2, text, m.isError); }
      }
      scrollChat();
      break;
    }
    case "tool_execution_start": {
      let card = findToolCard(d.toolCallId);
      if (!card) card = makeToolCard(d.toolCallId, d.toolName, d.args);
      card.classList.add("running");
      card.querySelector(".state").textContent = "running";
      break;
    }
    case "tool_execution_end": {
      const card = findToolCard(d.toolCallId);
      const text = ((d.result || {}).content || []).map(c => c.text || "").join("");
      if (card) finishToolCard(card, text, d.isError);
      break;
    }
    case "web_stderr":
      if (d.line) sysLine(d.line);
      break;
    case "web_error":
      sysLine(d.error || "run failed", true);
      break;
    case "web_done":
      if (d.exitCode !== 0) sysLine(`agent exited with code ${d.exitCode}`, true);
      break;
  }
}

/* ---------------- send loop ---------------- */
let pollErrors = 0;
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function pollLoop(cursor, reattach) {
  for (;;) {
    let d;
    try {
      d = await api(`/api/run?session=${encodeURIComponent(session)}&since=${cursor}`);
      pollErrors = 0;
    } catch (e) {
      if (e.message === "unauthorized") throw e;
      if (++pollErrors > 8) throw e;
      await sleep(2000);
      continue;
    }
    for (const line of d.events) {
      let ev;
      try { ev = JSON.parse(line); } catch (e) { continue; }
      try {
        if (reattach && ev.type === "message_end" && ev.message &&
            ev.message.role === "user")
          addUser(ev.message.content.map(c => c.text || "").join(" "));
        else onPiEvent(ev);
      } catch (e) { /* keep polling */ }
    }
    cursor = d.cursor;
    if (!d.running) return;
  }
}

async function send() {
  const ta = $("#prompt");
  const text = ta.value.trim();
  if (!text || running) return;
  const model = $("#model").value.trim();
  localStorage.setItem(MODEL_KEY, model);
  ta.value = ""; ta.style.height = "auto";
  newTurn();
  addUser(text);
  clearLive(); curA = null;
  running = true;
  setStatus("run", "agent running…");
  $("#send").disabled = true;
  $("#stopbtn").classList.add("show");
  try {
    await api("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, session, model: model || undefined }),
    });
    await pollLoop(0, false);
    setStatus("ok", lastRefreshStatus || "idle");
  } catch (e) {
    setStatus("err", "error");
    sysLine(e.message, true);
  } finally {
    running = false;
    $("#send").disabled = false;
    $("#stopbtn").classList.remove("show");
    refreshRepoViews();
    loadHistory();
  }
}

/* if a run is already active for this session (page reloaded mid-run),
   render history-before-run, then re-attach and replay the run buffer */
async function attachActiveRun() {
  if (running) return;
  let d;
  try {
    d = await api(`/api/run?session=${encodeURIComponent(session)}&since=0&wait=0`);
  } catch (e) { return; }
  if (!d.running) { loadHistory(); return; }
  running = true;
  setStatus("run", "re-attached — agent still running…");
  $("#send").disabled = true;
  $("#stopbtn").classList.add("show");
  await loadHistory((d.started || 0) - 1);
  newTurn();
  (async () => {
    try {
      await pollLoop(0, true);
      setStatus("ok", lastRefreshStatus || "idle");
    } catch (e) {
      setStatus("err", "error");
      sysLine(e.message, true);
    } finally {
      running = false;
      $("#send").disabled = false;
      $("#stopbtn").classList.remove("show");
      refreshRepoViews();
      loadHistory();
    }
  })();
}

$("#send").onclick = send;
$("#stopbtn").onclick = () => {
  api("/api/stop", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session }),
  }).catch(() => {});
};
$("#newchat").onclick = () => {
  if (running) { toast("stop the running agent first"); return; }
  session = newSessionId();
  localStorage.setItem(SESS_KEY, session);
  msgs.innerHTML = "";
  curTurn = curA = null;
  sysLine("new conversation");
  refreshRepoViews();
};

/* ---------------- status ---------------- */
function setStatus(cls, txt) {
  const s = $("#stat");
  s.className = cls;
  $("#stattxt").textContent = txt;
}

/* ---------------- file tree ---------------- */
let treeFiles = [];
async function loadTree() {
  try {
    const d = await api("/api/tree");
    treeFiles = d.files;
    renderTree();
  } catch (e) { /* auth handled */ }
}
function buildTree(files) {
  const root = {};
  for (const f of files) {
    const parts = f.path.split("/");
    let n = root;
    for (let i = 0; i < parts.length - 1; i++)
      n = n[parts[i]] = n[parts[i]] || {};
    n[parts[parts.length - 1]] = f;
  }
  return root;
}
function statusDot(f) {
  if (!f.status) return "";
  const c = f.status.trim()[0] === "?" ? "Q" : f.status.trim()[1] || f.status.trim()[0];
  return `<span class="sdot ${c}"></span>`;
}
function renderTree() {
  const q = $("#ftree-filter").value.trim().toLowerCase();
  const list = q ? treeFiles.filter(f => f.path.toLowerCase().includes(q)) : treeFiles;
  const tree = $("#tree");
  tree.innerHTML = "";
  const root = buildTree(list);
  const addLevel = (node, el, depth) => {
    const keys = Object.keys(node).sort((a, b) => {
      const ad = typeof node[a] !== "string" && !(node[a] && node[a].path), bd = typeof node[b] !== "string" && !(node[b] && node[b].path);
      return (bd - ad) || a.localeCompare(b);
    });
    for (const k of keys) {
      const v = node[k];
      if (v && v.path !== undefined) {
        const f = document.createElement("div");
        f.className = "file";
        f.style.paddingLeft = (depth * 14 + 14) + "px";
        f.innerHTML = esc(k) + statusDot(v);
        f.title = v.path;
        f.onclick = () => openFile(v.path);
        el.appendChild(f);
      } else {
        const d = document.createElement("div");
        d.className = "dir" + (depth < 1 ? " open" : "");
        const row = document.createElement("div");
        row.className = "row";
        row.style.paddingLeft = (depth * 14) + "px";
        row.innerHTML = `<span class="tw">▶</span>${esc(k)}/`;
        d.appendChild(row);
        const kids = document.createElement("div");
        kids.className = "kids";
        d.appendChild(kids);
        row.onclick = () => d.classList.toggle("open");
        addLevel(v, kids, depth + 1);
        el.appendChild(d);
      }
    }
  };
  addLevel(root, tree, 0);
}
$("#ftree-filter").addEventListener("input", renderTree);

/* ---------------- viewer ---------------- */
let vtab = "changes", curFile = null, curFileLang = null;
function setVtab(v) {
  vtab = v;
  document.querySelectorAll(".vtab").forEach(t => t.classList.toggle("on", t.dataset.v === v));
  renderViewer();
}
document.querySelectorAll(".vtab").forEach(t =>
  t.onclick = () => { if (!t.hasAttribute("disabled")) setVtab(t.dataset.v); });

async function openFile(path, view) {
  curFile = path;
  curFileLang = langOf(path);
  $("#tab-file").removeAttribute("disabled");
  $("#tab-diff").removeAttribute("disabled");
  $("#tab-file").textContent = path.split("/").pop();
  document.querySelectorAll(".file").forEach(f => f.classList.toggle("sel", f.title === path));
  setVtab(view || "file");
  $("#viewer").classList.add("force");
}
$("#vref").onclick = () => $("#viewer").classList.remove("force");

function renderCode(content, name) {
  const lines = content.split("\n");
  const cap = 4000;
  let rows = "";
  const lang = langOf(name);
  for (let i = 0; i < Math.min(lines.length, cap); i++)
    rows += `<tr><td class="ln">${i + 1}</td><td>${hl(lines[i], lang) || " "}</td></tr>`;
  return `<div class="codeview"><table>${rows}</table></div>` +
    (lines.length > cap ? `<div class="empty">… ${lines.length - cap} more lines truncated</div>` : "");
}

function renderDiff(text, jumpPath) {
  if (!text || !text.trim()) return '<div class="empty">no changes</div>';
  let html = "", fileHeader = "";
  for (const line of text.split("\n")) {
    if (line.startsWith("diff --git ")) {
      fileHeader = line.replace(/^diff --git a\/(\S+) b\/.*$/, "$1");
      html += `<div class="fh">${esc(line)}</div>`;
    } else if (line.startsWith("@@")) {
      html += `<div class="hunk">${esc(line)}</div>`;
    } else if (line.startsWith("+")) {
      html += `<div class="dl add"><span class="m">+</span>${esc(line.slice(1))}</div>`;
    } else if (line.startsWith("-")) {
      html += `<div class="dl del"><span class="m">−</span>${esc(line.slice(1))}</div>`;
    } else {
      html += `<div class="dl ctx"><span class="m">&nbsp;</span>${esc(line.slice(1))}</div>`;
    }
  }
  return `<div class="diff">${html}</div>`;
}

let lastFullDiff = "";
async function renderViewer() {
  const body = $("#vbody");
  $("#vref").textContent = vtab === "changes" ? "" : curFile || "";
  if (vtab === "file") {
    body.innerHTML = '<div class="empty">loading…</div>';
    try {
      const d = await api("/api/file?p=" + encodeURIComponent(curFile));
      body.innerHTML = renderCode(d.content, curFile);
    } catch (e) { body.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  } else if (vtab === "diff") {
    body.innerHTML = '<div class="empty">loading…</div>';
    try {
      const d = await api("/api/diff?p=" + encodeURIComponent(curFile));
      body.innerHTML = renderDiff(d.diff);
    } catch (e) { body.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  } else {
    body.innerHTML = '<div class="empty">loading…</div>';
    const [dd, lg] = await Promise.all([
      api("/api/diff").catch(() => ({ diff: "" })),
      api("/api/log").catch(() => ({ commits: [] })),
    ]);
    lastFullDiff = dd.diff || "";
    const changed = treeFiles.filter(f => f.status);
    $("#nchanges").textContent = changed.length || "";
    let html = "";
    html += `<div class="cmts"><summary>recent commits</summary>` +
      lg.commits.map(c =>
        `<div class="cmt"><span class="h">${esc(c.hash)}</span><span class="d">${esc(c.date)}</span><span>${esc(c.subject)}</span></div>`).join("") +
      `</div>`;
    if (changed.length) {
      html += `<div class="chlist">` + changed.map(f => {
        const c = f.status.trim()[0] === "?" ? "Q" : (f.status.trim()[1] || f.status.trim()[0]);
        return `<span class="chfile" data-p="${esc(f.path)}">${esc(f.path)} <span class="sdot ${c}"></span></span>`;
      }).join("") + `</div>`;
    }
    html += lastFullDiff ? renderDiff(lastFullDiff)
                         : '<div class="empty">no working-tree changes</div>';
    body.innerHTML = html;
    body.querySelectorAll(".chfile").forEach(el =>
      el.onclick = () => openFile(el.dataset.p, "diff"));
  }
}

/* ---------------- boot / refresh ---------------- */
async function loadHistory(runStartedMs) {
  try {
    const d = await api("/api/history?session=" + encodeURIComponent(session));
    msgs.innerHTML = ""; curTurn = curA = null;
    // cut off any turns that belong to the active run — its events are
    // replayed live from the run buffer instead
    const items = runStartedMs
      ? d.messages.filter(m => !(m.ts && Date.parse(m.ts) >= runStartedMs))
      : d.messages;
    const render = (item) => {
      if (item.role === "user") {
        newTurn();
        addUser(item.text);
      } else {
        if (!curTurn) newTurn();
        if (item.role === "assistant") {
          startAssistant();
          curA.insertAdjacentHTML("beforeend", `<div>${md(item.text)}</div>`);
        } else if (item.role === "tool") {
          ensureAssistant();
          const c = makeToolCard(item.toolCallId, item.name, item.args);
          c.classList.remove("running");
          c.querySelector(".state").textContent = "done";
        } else if (item.role === "toolResult") {
          const card = findToolCard(item.toolCallId);
          if (card) finishToolCard(card, item.output, item.isError);
          else {
            ensureAssistant();
            const c2 = makeToolCard(item.toolCallId, item.name, {});
            finishToolCard(c2, item.output, item.isError);
          }
        }
      }
    };
    for (const m of items) render(m);
    scrollChat();
  } catch (e) { /* keep empty */ }
}

let lastRefreshStatus = null;
async function refreshRepoViews() {
  try {
    const st = await api("/api/status");
    $("#hstat").textContent = `@ ${st.hostname} · ${st.repo} · ${st.branch}`;
    lastRefreshStatus = `pi ${st.pi} · ${st.dirty} dirty`;
    if (!running) setStatus("ok", lastRefreshStatus);
  } catch (e) { /* 401 lock */ }
  await loadTree();
  renderViewer();
}

async function loadModels() {
  try {
    const d = await api("/api/models");
    $("#model-list").innerHTML = d.models
      .map(m => `<option value="${esc(m.provider + "/" + m.model)}">ctx ${esc(m.context)} · think ${esc(m.thinking)}</option>`)
      .join("");
  } catch (e) { /* optional */ }
}

const ta = $("#prompt");
ta.addEventListener("input", () => {
  ta.style.height = "auto";
  ta.style.height = Math.min(180, ta.scrollHeight) + "px";
});
ta.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

function boot() {
  $("#model").value = localStorage.getItem(MODEL_KEY) || "";
  loadModels();
  refreshRepoViews();
  attachActiveRun();
}
boot();
</script>
