<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>services</title>
<style>
  :root {
    --bg: #16161e; --panel: #1e1e2a; --card: #22222f; --line: #31314580;
    --fg: #e6e6f0; --dim: #9a9ab0; --accent: #89b4fa;
    --green: #a6e3a1; --red: #f38ba8; --yellow: #f9e2af; --gray: #6c7086;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.45 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 48px;
  }
  header {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center;
    gap: 16px; flex-wrap: wrap; padding: 12px 20px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header h1 .at { color: var(--dim); font-weight: 400; }
  #gpu {
    display: flex; align-items: center; gap: 10px; color: var(--dim);
    cursor: pointer; padding: 4px 6px; border-radius: 7px; margin: -4px -6px;
    transition: background .15s;
  }
  #gpu:hover { background: #89b4fa14; }
  #gpu .name { color: var(--fg); }
  #gpu .chev { transition: transform .2s; font-size: 10px; }
  #gpu.open .chev { transform: rotate(90deg); }
  .bar { width: 120px; height: 6px; border-radius: 3px; background: #00000060; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); transition: width .6s; }
  .bar > div.hot { background: var(--yellow); }
  #ts { margin-left: auto; color: var(--dim); font-size: 12px; }
  main {
    display: grid; gap: 12px; padding: 16px 20px;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    max-width: 1280px; margin: 0 auto;
  }
  #gpu-detail {
    max-width: 1280px; margin: 0 auto; padding: 0 20px 4px;
    display: none;
  }
  #gpu-detail.open { display: block; }
  .gpu-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px 18px; display: flex; flex-direction: column; gap: 12px;
  }
  .gpu-stats { display: flex; gap: 28px; flex-wrap: wrap; }
  .gpu-stat { display: flex; flex-direction: column; gap: 2px; }
  .gpu-stat .k { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .gpu-stat .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .gpu-stat .v small { font-size: 11px; font-weight: 400; color: var(--dim); }
  .vram-track {
    display: flex; height: 26px; border-radius: 7px; overflow: hidden;
    background: #00000060; border: 1px solid var(--line);
  }
  .vram-track .seg { transition: width .6s; position: relative; }
  .vram-track .seg.ghost { background: #89b4fa30; }
  .vram-legend {
    display: flex; gap: 16px; flex-wrap: wrap; color: var(--dim); font-size: 12px;
  }
  .vram-legend .key { display: flex; align-items: center; gap: 6px; }
  .vram-legend .swatch { width: 10px; height: 10px; border-radius: 3px; }
  table.procs {
    width: 100%; border-collapse: collapse; font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  table.procs th {
    text-align: left; color: var(--dim); font-weight: 500; font-size: 11px;
    text-transform: uppercase; letter-spacing: .04em;
    padding: 4px 10px 6px 0; border-bottom: 1px solid var(--line);
  }
  table.procs td { padding: 6px 10px 6px 0; border-bottom: 1px solid #31314530; }
  table.procs tr:last-child td { border-bottom: none; }
  table.procs td.proc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 460px; }
  table.procs td.num, table.procs th.num { text-align: right; padding-right: 14px; }
  table.procs .pid { color: var(--dim); font: 11px/1 ui-monospace, monospace; }
  .gpu-note { color: var(--dim); font-size: 12px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;
  }
  .card.failed { border-color: #f38ba866; }
  .top { display: flex; align-items: baseline; gap: 8px; }
  .desc { font-weight: 600; flex: 1; min-width: 0;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge {
    font-size: 11px; padding: 2px 9px; border-radius: 99px; white-space: nowrap;
    border: 1px solid; text-transform: capitalize;
  }
  .badge.active   { color: var(--green);  border-color: #a6e3a160; background: #a6e3a114; }
  .badge.activating, .badge.reloading { color: var(--yellow); border-color: #f9e2af60; background: #f9e2af14; }
  .badge.failed   { color: var(--red);    border-color: #f38ba860; background: #f38ba814; }
  .badge.inactive, .badge.dead { color: var(--gray); border-color: #6c708650; }
  .meta { color: var(--dim); font-size: 12px; display: flex; gap: 12px; flex-wrap: wrap; }
  .meta code { font: 11px/1 ui-monospace, monospace; background: #00000040;
               padding: 2px 5px; border-radius: 4px; }
  .row { display: flex; gap: 8px; margin-top: 2px; }
  button {
    font: inherit; color: var(--fg); background: #00000050;
    border: 1px solid var(--line); border-radius: 7px; padding: 5px 14px;
    cursor: pointer; transition: background .15s, border-color .15s;
  }
  button:hover:not(:disabled) { background: #89b4fa26; border-color: #89b4fa80; }
  button:disabled { opacity: .35; cursor: default; }
  button.stop:hover:not(:disabled) { background: #f38ba826; border-color: #f38ba880; }
  button.logs { margin-left: auto; color: var(--dim); }
  #drawer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--panel); border-top: 1px solid var(--line);
    display: flex; flex-direction: column; max-height: 45vh;
  }
  #drawer header {
    position: static; padding: 8px 16px; background: transparent;
    border-bottom: 1px solid var(--line);
  }
  #drawer header b { font-size: 13px; }
  #drawer pre {
    margin: 0; padding: 10px 16px; overflow: auto; flex: 1;
    font: 12px/1.5 ui-monospace, "JetBrains Mono", monospace;
    color: #cdd6f4; white-space: pre-wrap; word-break: break-all;
  }
  #toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: #f38ba8; color: #16161e; font-weight: 600; padding: 8px 18px;
    border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .3s;
    z-index: 20; max-width: 80vw;
  }
  #toast.show { opacity: 1; }
  #lock {
    position: fixed; inset: 0; z-index: 30; background: #000000cc;
    display: flex; align-items: center; justify-content: center;
  }
  #lock[hidden] { display: none; }
  #lock form {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 24px; display: flex; flex-direction: column; gap: 10px; width: 320px;
  }
  #lock input {
    font: inherit; background: #00000050; color: var(--fg);
    border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px;
  }
</style>
</head>
<body>
<header>
  <h1>services <span class="at" id="hostname"></span></h1>
  <div id="gpu" hidden>
    <span class="chev">&#9656;</span>
    <span class="name"></span>
    <div class="bar"><div></div></div>
    <span class="txt"></span>
  </div>
  <span id="ts"></span>
</header>
<div id="gpu-detail">
  <div class="gpu-card">
    <div class="gpu-stats">
      <div class="gpu-stat"><span class="k">VRAM</span><span class="v" id="g-mem"></span></div>
      <div class="gpu-stat"><span class="k">Compute</span><span class="v" id="g-util"></span></div>
      <div class="gpu-stat"><span class="k">Temp</span><span class="v" id="g-temp"></span></div>
    </div>
    <div class="vram-track" id="g-track"></div>
    <div class="vram-legend" id="g-legend"></div>
    <div id="g-procs"></div>
    <div class="gpu-note" id="g-note"></div>
  </div>
</div>
<main></main>

<div id="drawer" hidden>
  <header><b id="drawer-title"></b>
    <button class="logs" onclick="refreshLogs()">refresh</button>
    <button class="logs" onclick="closeDrawer()">close (esc)</button>
  </header>
  <pre id="drawer-log"></pre>
</div>

<div id="toast"></div>
<div id="lock" hidden>
  <form onsubmit="return saveToken(event)">
    <b>service-panel</b>
    <span style="color:var(--dim)">A bearer token is required.</span>
    <input id="token-input" type="password" placeholder="token" autofocus>
    <button type="submit">unlock</button>
  </form>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const cards = new Map();
let drawerUnit = null;

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 4000);
}

async function api(path, opts) {
  const headers = Object.assign({}, opts && opts.headers);
  const tok = localStorage.getItem("panel_token");
  if (tok) headers["Authorization"] = "Bearer " + tok;
  const r = await fetch(path, Object.assign({}, opts, { headers }));
  if (r.status === 401) { $("#lock").hidden = false; throw new Error("unauthorized"); }
  return r.json();
}

function saveToken(ev) {
  ev.preventDefault();
  localStorage.setItem("panel_token", $("#token-input").value);
  $("#lock").hidden = true;
  refresh();
  return false;
}

function badgeState(s) {
  if (s.active === "active" && s.sub === "reload") return "reloading";
  if (s.active === "activating" && s.sub === "auto-restart") return "restarting";
  return s.active;
}

function rel(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  if (isNaN(d)) return ts;
  const s = (Date.now() - d) / 1000;
  if (s < 0) return "";
  if (s < 60) return Math.floor(s) + "s";
  const m = s / 60;
  if (m < 60) return Math.floor(m) + "m " + Math.floor(s % 60) + "s";
  const h = m / 60;
  if (h < 24) return Math.floor(h) + "h " + Math.floor(m % 60) + "m";
  return Math.floor(h / 24) + "d " + Math.floor(h % 24) + "h";
}

function makeCard(s) {
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = `
    <div class="top">
      <span class="desc" title=""></span>
      <span class="badge"></span>
    </div>
    <div class="meta"><code></code><span class="since"></span><span class="load"></span></div>
    <div class="row">
      <button data-act="start">Start</button>
      <button data-act="stop" class="stop">Stop</button>
      <button data-act="restart">Restart</button>
      <button class="logs">Logs</button>
    </div>`;
  el.querySelector("[data-act=start]").onclick = () => act(s.unit, "start");
  el.querySelector("[data-act=stop]").onclick = () => act(s.unit, "stop");
  el.querySelector("[data-act=restart]").onclick = () => act(s.unit, "restart");
  el.querySelector(".logs").onclick = () => openDrawer(s.unit);
  return el;
}

function updateCard(s) {
  let el = cards.get(s.unit);
  if (!el) {
    el = makeCard(s);
    cards.set(s.unit, el);
    $("main").appendChild(el);
  }
  el.querySelector(".desc").textContent = s.description || s.unit;
  el.querySelector(".desc").title = s.unit;
  const b = el.querySelector(".badge");
  b.textContent = badgeState(s);
  b.className = "badge " + badgeState(s);
  el.querySelector("code").textContent = s.unit;
  el.querySelector(".since").textContent =
    (s.active === "active" || s.active === "activating") && s.since
      ? "up " + rel(s.since) : "";
  el.querySelector(".load").textContent =
    s.load === "not-found" ? "not loaded" : "";
  el.classList.toggle("failed", s.active === "failed");
  const busy = el.dataset.busy === "1";
  el.querySelector("[data-act=start]").disabled = busy || s.active === "active";
  el.querySelector("[data-act=stop]").disabled = busy || s.active === "inactive";
  el.querySelector("[data-act=restart]").disabled = busy || s.active === "inactive";
}

async function act(unit, action) {
  const el = cards.get(unit);
  el.dataset.busy = "1";
  try {
    const r = await api(`/api/unit/${encodeURIComponent(unit)}/${action}`,
                        { method: "POST" });
    if (!r.ok && r.stderr) toast(`${action} ${unit}: ${r.stderr.slice(0, 200)}`);
  } catch (e) { /* toast handled in api */ }
  delete el.dataset.busy;
  refresh();
}

const PROC_COLORS = ["#89b4fa", "#a6e3a1", "#f5c2e7", "#f9e2af", "#94e2d5",
                     "#cba6f7", "#89dceb", "#eba0ac"];
const GHOST_COLOR = "rgba(137,180,250,0.19)";
let gpuOpen = false;
let lastGpu = null;

function fmtMiB(miB) {
  return miB >= 1024 ? (miB / 1024).toFixed(2) + " GiB" : miB + " MiB";
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
}

function renderGpu(gpu) {
  const el = $("#gpu"), detail = $("#gpu-detail");
  if (!gpu) { el.hidden = true; detail.classList.remove("open"); return; }
  el.hidden = false;
  el.querySelector(".name").textContent = gpu.name;
  const pct = gpu.memTotalMiB ? gpu.memUsedMiB / gpu.memTotalMiB : 0;
  const fill = el.querySelector(".bar > div");
  fill.style.width = Math.min(100, pct * 100).toFixed(1) + "%";
  fill.className = pct > 0.9 ? "hot" : "";
  const parts = [`${(gpu.memUsedMiB / 1024).toFixed(1)}/${(gpu.memTotalMiB / 1024).toFixed(1)} GiB`];
  if (gpu.utilPct != null) parts.push(gpu.utilPct + "%");
  if (gpu.tempC != null) parts.push(gpu.tempC + "\u00b0C");
  el.querySelector(".txt").textContent = parts.join(" \u00b7 ");
  lastGpu = gpu;
  detail.classList.toggle("open", gpuOpen);
  el.classList.toggle("open", gpuOpen);
  if (gpuOpen) renderGpuDetail(gpu);
}

function renderGpuDetail(gpu) {
  $("#g-mem").innerHTML =
    `${(gpu.memUsedMiB / 1024).toFixed(2)}<small> / ${(gpu.memTotalMiB / 1024).toFixed(2)} GiB</small>`;
  $("#g-util").innerHTML =
    gpu.utilPct == null ? "\u2014" : `${gpu.utilPct}<small>%</small>`;
  $("#g-temp").innerHTML =
    gpu.tempC == null ? "\u2014" : `${gpu.tempC}<small>\u00b0C</small>`;

  const procs = (gpu.processes || []).filter(p => p.vramMiB > 0);
  const known = procs.reduce((a, p) => a + p.vramMiB, 0);
  const ghost = Math.max(0, gpu.memUsedMiB - known);
  const total = gpu.memTotalMiB || 1;

  // Segmented VRAM bar: one colored segment per process, plus a ghost
  // segment for kernel/display/unattributed usage.
  const segs = procs.map((p, i) => ({
    label: `${p.name} (${p.user})`, miB: p.vramMiB,
    color: PROC_COLORS[i % PROC_COLORS.length],
  }));
  if (ghost > 1) {
    segs.push({ label: "system / display / unattributed", miB: ghost,
                color: GHOST_COLOR });
  }
  const track = $("#g-track");
  track.innerHTML = "";
  for (const s of segs) {
    const d = document.createElement("div");
    d.className = "seg" + (s.color === GHOST_COLOR ? " ghost" : "");
    d.style.width = Math.min(100, s.miB / total * 100).toFixed(2) + "%";
    d.style.background = s.color;
    d.title = `${s.label}: ${fmtMiB(s.miB)}`;
    track.appendChild(d);
  }

  const legend = $("#g-legend");
  legend.innerHTML = "";
  for (const s of segs) {
    const k = document.createElement("span");
    k.className = "key";
    k.title = fmtMiB(s.miB);
    const sw = document.createElement("span");
    sw.className = "swatch";
    sw.style.background = s.color;
    k.appendChild(sw);
    k.appendChild(document.createTextNode(s.label));
    legend.appendChild(k);
  }

  const wrap = $("#g-procs");
  if (!procs.length) {
    wrap.innerHTML = "<div class=\"gpu-note\">No processes reporting VRAM usage" +
      (gpu.processes ? "" : " (per-process stats unavailable)") + "</div>";
  } else {
    let rows = "";
    for (const p of procs) {
      rows += `<tr><td class="pid">${p.pid}</td>` +
        `<td class="proc" title="${esc(p.name)}">${esc(p.name)}</td>` +
        `<td>${esc(p.user)}</td>` +
        `<td class="num">${fmtMiB(p.vramMiB)}${p.gttMiB ?
          ` <span style="color:var(--dim)">(+${fmtMiB(p.gttMiB)} GTT)</span>` : ""}</td>` +
        `<td class="num">${(p.vramMiB / total * 100).toFixed(1)}%</td></tr>`;
    }
    wrap.innerHTML = `<table class="procs"><thead><tr>` +
      `<th>PID</th><th>Process</th><th>User</th><th class="num">VRAM</th>` +
      `<th class="num">% of total</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  $("#g-note").textContent = procs.length
    ? `${procs.length} process${procs.length > 1 ? "es" : ""} \u00b7 attributed ${fmtMiB(known)}` +
      (ghost > 1 ? ` \u00b7 other ${fmtMiB(ghost)}` : "")
    : "";
}

$("#gpu").addEventListener("click", () => {
  gpuOpen = !gpuOpen;
  $("#gpu").classList.toggle("open", gpuOpen);
  $("#gpu-detail").classList.toggle("open", gpuOpen);
  if (gpuOpen && lastGpu) renderGpuDetail(lastGpu);
});

async function refresh() {
  try {
    const st = await api("/api/status");
    $("#hostname").textContent = "@" + st.hostname;
    for (const s of st.services) updateCard(s);
    renderGpu(st.gpu);
    $("#ts").textContent = "updated " + new Date().toLocaleTimeString();
  } catch (e) { /* keep last state; 401 shows the lock */ }
}

async function refreshLogs() {
  if (!drawerUnit) return;
  try {
    const r = await api(`/api/logs/${encodeURIComponent(drawerUnit)}`);
    const pre = $("#drawer-log");
    const stick = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 40;
    pre.textContent = r.lines || "(no journal output)";
    if (stick) pre.scrollTop = pre.scrollHeight;
  } catch (e) { /* ignore */ }
}

function openDrawer(unit) {
  drawerUnit = unit;
  $("#drawer-title").textContent = unit;
  $("#drawer").hidden = false;
  refreshLogs();
}

function closeDrawer() {
  drawerUnit = null;
  $("#drawer").hidden = true;
}

document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
refresh();
setInterval(refresh, 3000);
setInterval(() => { if (drawerUnit && !$("#drawer").hidden) refreshLogs(); }, 5000);
</script>
</body>
</html>
