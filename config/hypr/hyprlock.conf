# ──────────────────────────────────────────────
# hyprlock — Catppuccin Mocha
# Bound to Super+L
# ──────────────────────────────────────────────

background {
    monitor =
    path = screenshot
    color = rgba(30, 30, 46, 1.0)
    blur_passes = 3
    blur_size = 6
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(205, 214, 244, 1.0)
    font_size = 110
    font_family = Fira Sans
    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:3600000] echo "$(date +'%A, %d %B %Y')"
    color = rgba(166, 173, 200, 1.0)
    font_size = 26
    font_family = Fira Sans
    position = 0, 70
    halign = center
    valign = center
}

# Password prompt
input-field {
    monitor =
    size = 300, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false
    placeholder_text = <i>Enter password</i>
    fail_text = <i>Incorrect ($ATTEMPTS)</i>
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
    font_family = Fira Sans
    font_size = 16
    font_color = rgb(cdd6f4)
    inner_color = rgba(24, 24, 37, 0.9)
    outer_color = rgba(137, 180, 250, 0.6)
    check_color = rgba(166, 227, 161, 0.8)
    fail_color = rgba(243, 139, 168, 0.9)
    fail_transition = 300
}
