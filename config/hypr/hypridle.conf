# Idle daemon — started by hyprland.lua on session start.
# Locks with hyprlock, then turns the screens off. Test with `hyprctl dispatch hl.dsp.force_idle(5)`.
# Battery-gated listeners use `systemd-ac-power || ...` (exit 0 on AC → skip).

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep = loginctl lock-session
    after_resume =
}

# Lock after 5 min idle
listener {
    timeout = 300
    on-timeout = hyprlock
}

# Screens off after 6 min idle (a minute after the lock kicks in)
listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Screens off after 5 min on battery (together with the lock)
listener {
    timeout = 300
    on-timeout = systemd-ac-power || hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Screens off after 6 min idle on AC (a minute after the lock kicks in)
listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Hibernate after 14 min on battery — requires resume= kernel param
listener {
    timeout = 840
    on-timeout = systemd-ac-power || systemctl hibernate
}
