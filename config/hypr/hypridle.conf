# Idle daemon — started by hyprland.lua on session start.
# Locks with hyprlock, then turns the screens off. Test with `hyprctl dispatch forceidle 5`.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep = loginctl lock-session
    after_resume =
}

# Lock after 5 min idle
listener {
    timeout = 300
    on-timeout = hyprlock
}

# Screens off after 6 min idle (a minute after the lock kicks in)
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 30 min idle — uncomment on the laptops
# listener {
#     timeout = 1800
#     on-timeout = systemctl suspend
# }
