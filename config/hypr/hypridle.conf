# Idle daemon — runs as the systemd user unit (graphical-session.target.wants).
# Locks with hyprlock, then turns the screens off. Test with `hyprctl dispatch hl.dsp.force_idle(5)`.
# Battery-gated listeners use `systemd-ac-power || ...` (exit 0 on AC → skip).
# The pidof guard keeps a second locker from stacking if a stale daemon ever fires too —
# two simultaneous hyprlocks race for the session lock and keyboard focus ends up on
# the one whose input field isn't visible (mouse moves, typing does nothing).

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}

# Lock after 5 min idle
listener {
    timeout = 300
    on-timeout = pidof hyprlock || hyprlock
}

# Screens off after 6 min idle (a minute after the lock kicks in)
listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Screens off after 5 min on battery (together with the lock)
listener {
    timeout = 300
    on-timeout = systemd-ac-power || hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Screens off after 6 min idle on AC (a minute after the lock kicks in)
listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Auto-suspend after 15 min idle on battery. Safety net: the EC can wake the
# machine from s2idle with an event logind never sees (suspend → close lid in a
# bag), leaving the session running locked with the screen off.
listener {
    timeout = 900
    on-timeout = systemd-ac-power || systemctl suspend
}
